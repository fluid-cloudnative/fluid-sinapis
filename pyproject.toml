[project]
name = "fluid-sinapis-agent"
version = "0.1.0"
description = "Structured decisions and execution for Fluid runtime scaling and data preloading"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12,<3",
    "kubernetes>=32,<35",
    "urllib3>=2,<3",
    "prometheus-client>=0.20,<1",
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The same test module name exists in different directories (tests/test_config.py and
# tests/agent/test_config.py), so the default prepend import mode collides. Collecting by
# import path is the only way to run the whole suite.
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
